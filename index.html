<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Um convite especial</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;

            /* Fundo com jantar à luz de velas */
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.65)
                ),
                url("https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1600&q=85");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .convite {
            width: 90%;
            max-width: 430px;
            padding: 35px 25px;
            text-align: center;

            background: rgba(0, 0, 0, 0.72);
            border-radius: 22px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.55),
                0 0 30px rgba(255, 190, 100, 0.15);

            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .titulo {
            color: #ffffff;
            font-size: 25px;
            line-height: 1.45;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .botao {
            display: inline-block;
            padding: 15px 28px;

            background: #25D366;
            color: white;

            text-decoration: none;
            font-size: 18px;
            font-weight: bold;

            border-radius: 12px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);

            transition: 0.3s;
        }

        .botao:hover {
            transform: scale(1.05);
            background: #20bd5a;
        }

        .botao:active {
            transform: scale(0.98);
        }

        .whatsapp {
            margin-right: 8px;
        }

        @media (max-width: 480px) {

            .convite {
                width: 92%;
                padding: 30px 20px;
            }

            .titulo {
                font-size: 21px;
            }

            .botao {
                font-size: 17px;
                padding: 14px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="convite">

        <div class="titulo">
            Sexta te busco 20:00,<br><br>
            sua responsabilidade é apenas me mandar o endereço
            e estar presente às 20:00.
        </div>

        <a
            class="botao"
            href="https://wa.me/5511970218569?text=Confirmado!%20Sexta%20%C3%A0s%2020:00.%20Vou%20te%20mandar%20o%20endere%C3%A7o."
            target="_blank"
        >
            <span class="whatsapp">💬</span>
            Falar no WhatsApp
        </a>

    </div>

</body>
</html>
