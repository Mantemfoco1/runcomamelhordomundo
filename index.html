    <title>Convite</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.40),

                ),

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .convite {
            width: 90%;
            max-width: 430px;

            padding: 35px 25px;

            text-align: center;

            background: rgba(0, 0, 0, 0.72);

            border-radius: 22px;

            border: 1px solid rgba(255, 255, 255, 0.20);

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.55),
                0 0 30px rgba(255, 255, 255, 0.08);
        }

        .texto {
            color: white;

            font-size: 25px;
            line-height: 1.45;

            font-weight: bold;

            margin-bottom: 30px;
        }

        .botao {
            display: inline-block;

            padding: 15px 28px;

            background: #25D366;
            color: white;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            border-radius: 12px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.35);

            transition: 0.3s;
        }

        .botao:hover {
            transform: scale(1.05);
            background: #20bd5a;
        }

        .botao:active {
            transform: scale(0.98);
        }

        .icone {
            margin-right: 8px;
        }

        @media (max-width: 480px) {

            .convite {
                width: 92%;
                padding: 30px 20px;
            }

            .texto {
                font-size: 21px;
            }

            .botao {
                font-size: 17px;
                padding: 14px 22px;
            }
        }
    </style>
</head>

<body>
